buildscript {
    repositories {
        google() // Ensure Google's Maven repository is included
        mavenCentral()
    }
    dependencies {
        classpath("com.google.gms:google-services:4.4.2") // Use the latest version
    }
}

plugins {
    id 'com.android.application'
    // other plugins can be added here
}

apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.example.ipollusen'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ipollusen"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material // Assuming this is defined in your libs catalog
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.preference
    implementation libs.play.services.maps
    implementation libs.play.services.location
    implementation libs.navigation.runtime
    implementation libs.databinding.runtime
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Firebase and Google Services
    implementation platform("com.google.firebase:firebase-bom:33.4.0")
    implementation("com.google.firebase:firebase-auth:23.0.0")
    implementation("com.google.android.gms:play-services-auth:21.2.0")
    implementation("com.firebaseui:firebase-ui-auth:8.0.0") // Updated version
    implementation("com.google.firebase:firebase-database:21.0.0")

    // RxJava and RxAndroid
    implementation("com.polidea.rxandroidble3:rxandroidble:1.19.0")
    implementation 'io.reactivex.rxjava3:rxjava:3.1.0'
    implementation("io.reactivex.rxjava3:rxandroid:3.0.1")
    implementation 'com.google.code.gson:gson:2.8.8'
    // AndroidX Lifecycle
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2") // Updated version
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.6.2") // Updated version
    implementation 'com.google.android.material:material:1.6.1'
    // Chart Libraries
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
    implementation("com.github.AnyChart:AnyChart-Android:1.1.5")

    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.20'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation 'com.github.hannesa2:paho.mqtt.android:3.3.5'


    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.hannesa2:paho.mqtt.android:3.3.5@aar'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation 'com.opencsv:opencsv:5.6'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.14'
    implementation 'org.apache.commons:commons-csv:1.8'
    implementation 'com.google.android.material:material:1.3.0-alpha02'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}
